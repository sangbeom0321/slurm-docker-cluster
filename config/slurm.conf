#
# slurm.conf - 자동 생성됨 (generate-slurm-conf.sh)
# 수정하지 마세요. cluster.conf를 수정한 뒤 스크립트를 재실행하세요.
#

ClusterName=gpucluster
SlurmctldHost=daniel
SlurmUser=slurm
AuthType=auth/munge

GresTypes=gpu

ProctrackType=proctrack/linuxproc
ReturnToService=1
TaskPlugin=task/affinity

SlurmctldPort=6817
SlurmdPort=6818

SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdSpoolDir=/var/spool/slurm
StateSaveLocation=/var/lib/slurm

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

AccountingStorageHost=daniel
AccountingStorageType=accounting_storage/slurmdbd
JobCompLoc=/var/log/slurm/jobcomp.log
JobCompType=jobcomp/filetxt
JobAcctGatherFrequency=30
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# ============================================================
# 노드 정의 (cluster.conf에서 자동 생성)
# ============================================================
NodeName=daniel NodeAddr=192.168.0.47 CPUs=24 RealMemory=30000 Gres=gpu:5060ti:1 State=UNKNOWN
NodeName=5090 NodeAddr=192.168.0.153 CPUs=24 RealMemory=62000 Gres=gpu:5090:1 State=UNKNOWN

# ============================================================
# 파티션
# ============================================================
PartitionName=all Nodes=daniel,5090 Default=YES MaxTime=INFINITE State=UP
